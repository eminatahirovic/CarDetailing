<section class="py-5">
  <div class="container">
    <!-- Header with Welcome & Logout -->
    <div class="row mb-5">
      <div class="col">
        <h1 class="h2 mb-0">Welcome, <span id="dashboardUserName">User</span>!</h1>
        <p class="text-muted mb-0">Here's your dashboard</p>
      </div>
      <div class="col-auto d-flex align-items-center">
        <button class="btn btn-outline-danger" id="logoutBtn">Logout</button>
      </div>
    </div>

    <!-- Quick Stats -->
    <div class="row g-3 mb-5">
      <div class="col-12 col-sm-6 col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <h6 class="text-muted mb-2">Total Bookings</h6>
            <h2 class="mb-0" id="totalBookings">0</h2>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <h6 class="text-muted mb-2">Upcoming</h6>
            <h2 class="mb-0" id="upcomingBookings">0</h2>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <h6 class="text-muted mb-2">Completed</h6>
            <h2 class="mb-0" id="completedBookings">0</h2>
          </div>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="mb-5">
      <div class="row g-2">
        <div class="col-12 col-sm-auto">
          <button class="btn btn-primary btn-lg w-100 w-sm-auto" id="bookNewBtn">+ Book New Service</button>
        </div>
        <div class="col-12 col-sm-auto">
          <a href="#profile" class="btn btn-secondary btn-lg w-100 w-sm-auto">View Profile</a>
        </div>
      </div>
    </div>

    <!-- Notices Section -->
    <div class="mb-5">
      <h3 class="mb-3">📢 Notices</h3>
      <div id="noticesContainer">
        <div class="alert alert-info alert-dismissible fade show" role="alert">
          <strong>Welcome!</strong> Log in to your account to manage your bookings and services.
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      </div>
    </div>

    <!-- Bookings Section -->
    <div class="mb-5">
      <h3 class="mb-3">📅 Your Bookings</h3>
      <div id="bookingsContainer">
        <div class="text-center py-5">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="text-muted mt-3">Loading your bookings...</p>
        </div>
      </div>
    </div>

  </div>
</section>

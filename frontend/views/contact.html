<section class="container py-5">
  <div class="row g-4">
    <div class="col-lg-6">
      <h2 class="section-title h3 mb-3">Contact & Booking</h2>
      <p class="text-muted">Fill out the form and we'll confirm your appointment.</p>
      <form onsubmit="event.preventDefault(); this.reset(); alert('Thank you! We will contact you shortly.');">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Full name</label><input type="text" class="form-control" required></div>
          <div class="col-md-6"><label class="form-label">Phone</label><input type="tel" class="form-control" required></div>
          <div class="col-12"><label class="form-label">Email</label><input type="email" class="form-control" required></div>
          <div class="col-12"><label class="form-label">Service</label><select class="form-select"><option>Basic Wash</option><option>Interior Detail</option><option>Full Detail</option></select></div>
          <div class="col-12"><label class="form-label">Message</label><textarea class="form-control" rows="4"></textarea></div>
          <div class="col-12"><button class="btn btn-primary">Send</button></div>
        </div>
      </form>
    </div>
    <div class="col-lg-6">
      <div class="card h-100"><div class="card-body">
        <h5>Location</h5>
        <p class="text-muted small">Voje Dimitrijevića 15, Sarajevo</p>
        <div class="ratio ratio-16x9"><iframe src="https://maps.google.com/maps?q=Sarajevo&t=&z=13&ie=UTF8&iwloc=&output=embed" title="Map"></iframe></div>
      </div></div>
    </div>
  </div>
</section>

<section id="login"><section class="container py-5" style="max-width:640px;">
  <h2 class="section-title h3 mb-3">Login</h2>
  <form onsubmit="event.preventDefault(); alert('Not connected yet.');">
    <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" required></div>
    <div class="d-flex justify-content-between align-items-center">
      <div class="form-check"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label" for="remember">Remember me</label></div>
      <a href="#register" class="small">Create account</a>
    </div>
    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-primary">Login</button>
      <a class="btn btn-outline-secondary" href="#home">Cancel</a>
    </div>
  </form>
</section></section>
